# .github/workflows/crypto_bot.yml
# LIVE MODE — DRY_RUN=0

name: Crypto Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SYMBOLS: "BTC,ETH"
      INITIAL_CAPITAL: "50"
      RISK_PER_TRADE: "0.02"
      STOP_LOSS_PCT: "0.03"
      TAKE_PROFIT_PCT: "0.05"
      MAX_ORDER_AMOUNT_USD: "25"
      MIN_BUYING_POWER_BUFFER: "25"
      CIRCUIT_BREAKER_LOSSES: "3"
      MIN_SIGNAL_GAP_PCT: "0.0015"
      MIN_SIGNAL_PROFIT_PCT: "0.03"
      MIN_HOLD_CANDLES: "4"
      DRY_RUN: "0"
      PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crypto-bot-state-${{ github.ref_name }}-

      # ── ONE-TIME FIX: heal corrupted state.json ──────────────────────────
      # Issue 1 from audit:
      #   - capital out of sync with positions
      #   - positions exceed MAX_ORDER_AMOUNT_USD ($25)
      #   - positions missing entry_candle
      #   - missing consecutive_losses, last_daily_summary, circuit_notified
      #
      # IMPORTANT: After this step runs ONCE successfully, REMOVE it from
      # the workflow so it doesn't keep clobbering valid state.
      - name: Heal state.json
        run: |
          python << 'PYEOF'
          import json, os

          if not os.path.exists("state.json"):
              print("No state.json found — nothing to heal")
              raise SystemExit(0)

          with open("state.json") as f:
              s = json.load(f)

          print("BEFORE:", json.dumps({k: v if k != 'price_history' else f"<{sum(len(p) for p in v.values())} prices>" for k,v in s.items()}, indent=2))

          # 1. Backfill missing keys
          s.setdefault("consecutive_losses", {})
          s.setdefault("last_daily_summary", "")
          s.setdefault("circuit_notified", {})
          s.setdefault("price_history", {})

          # 2. Heal each open position
          positions = s.get("positions", {})
          history   = s.get("price_history", {})
          for sym, pos in list(positions.items()):
              # Backfill entry_candle so min-hold guardrail works
              if "entry_candle" not in pos:
                  candle_count = len(history.get(sym, []))
                  pos["entry_candle"] = max(0, candle_count - 1)
                  print(f"  {sym}: set entry_candle={pos['entry_candle']}")

              # Cap usd_amount at MAX_ORDER_AMOUNT_USD ($25)
              # NOTE: This doesn't change the actual position on Public,
              # only what the bot THINKS it bought. P&L will use this
              # adjusted size for tracking. The real shares are still held.
              # Better: leave usd_amount alone but flag it
              real_usd = pos.get("usd_amount", 0)
              if real_usd > 25.0:
                  print(f"  {sym}: WARNING usd_amount=${real_usd:.2f} exceeds cap, leaving as-is for accurate P&L on this position")

          # 3. Recalculate capital based on a clean baseline
          # If positions sum to more than capital recorded, capital is stale
          total_in_positions = sum(p.get("usd_amount", 0) for p in positions.values())
          if total_in_positions > s.get("capital", 0):
              new_capital = float(os.getenv("INITIAL_CAPITAL", "50"))
              print(f"  Capital ${s.get('capital', 0):.2f} < positions ${total_in_positions:.2f} — resetting capital to INITIAL_CAPITAL=${new_capital:.2f}")
              s["capital"] = new_capital

          with open("state.json", "w") as f:
              json.dump(s, f, indent=2)

          print("\nAFTER:")
          print(f"  capital            = {s['capital']:.2f}")
          print(f"  positions          = {list(s['positions'].keys())}")
          print(f"  consecutive_losses = {s['consecutive_losses']}")
          print(f"  circuit_notified   = {s['circuit_notified']}")
          for sym, pos in s['positions'].items():
              print(f"  {sym} entry_candle = {pos.get('entry_candle')}")
          PYEOF
      # ─────────────────────────────────────────────────────────────────────

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-${{ github.run_id }}
          path: state.json
          retention-days: 7