# .github/workflows/crypto_bot.yml
# LIVE MODE — DRY_RUN=0

name: Crypto Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # ── Non-secrets ───────────────────────────────────────────────────────
      SYMBOLS: "BTC,ETH"
      INITIAL_CAPITAL: "15"
      RISK_PER_TRADE: "0.02"
      STOP_LOSS_PCT: "0.03"
      TAKE_PROFIT_PCT: "0.05"
      MAX_ORDER_AMOUNT_USD: "10"      # hard cap per trade
      CIRCUIT_BREAKER_LOSSES: "3"    # pause symbol after 3 consecutive losses
      RUN_ONCE: "1"
      DRY_RUN: "0"

      # ── Secrets ───────────────────────────────────────────────────────────
      PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crypto-bot-state-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}