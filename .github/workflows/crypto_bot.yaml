# .github/workflows/crypto_bot.yml
# LIVE MODE — DRY_RUN=0

name: Crypto Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SYMBOLS: "BTC,ETH"
      INITIAL_CAPITAL: "50"
      RISK_PER_TRADE: "0.02"
      STOP_LOSS_PCT: "0.03"
      TAKE_PROFIT_PCT: "0.05"
      MAX_ORDER_AMOUNT_USD: "10"
      MIN_BUYING_POWER_BUFFER: "25"  # always keep $25 free across both bots
      CIRCUIT_BREAKER_LOSSES: "3"
      RUN_ONCE: "1"
      DRY_RUN: "0"
      PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crypto-bot-state-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}
      
      - name: Fix ETH position size
        run: |
          python -c "
          import json
          with open('state.json') as f:
              s = json.load(f)
          if 'ETH' in s.get('positions', {}):
              pos = s['positions']['ETH']
              if not pos.get('size_estimate') or pos['size_estimate'] == 0:
                  pos['size_estimate'] = pos['usd_amount'] / pos['entry']
                  print(f'Fixed ETH size_estimate: {pos[\"size_estimate\"]:.8f}')
          with open('state.json', 'w') as f:
              json.dump(s, f, indent=2)
          print('State:', s['positions'])
          "

      # Upload state.json as a downloadable artifact after every run.
      # Lets you inspect current capital, positions, price history, and
      # EMA gaps directly from the Actions tab without running anything locally.
      # Artifacts are retained for 7 days by default.
      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-${{ github.run_id }}
          path: state.json
          retention-days: 7