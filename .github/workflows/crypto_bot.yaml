# .github/workflows/crypto_bot.yml

name: Crypto Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SYMBOLS: "BTC,ETH"
      INITIAL_CAPITAL: "30"
      RISK_PER_TRADE: "0.02"
      STOP_LOSS_PCT: "0.03"
      TAKE_PROFIT_PCT: "0.05"
      RUN_ONCE: "1"
      DRY_RUN: "1"           # set to "0" when ready for live trading
      PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Restore: match any previously saved state for this branch
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crypto-bot-state-${{ github.ref_name }}-
      
      - name: Debug state
        run: cat state.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py

      # Save: always use a unique key (run_id) so the save never collides
      # with an existing immutable cache entry and silently fails.
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}