# .github/workflows/crypto_bot.yml
# LIVE MODE — DRY_RUN=0
#
# Strategy v2 — adds regime filter, ATR-based SL/TP, post-exit cooldown.

name: Crypto Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SYMBOLS: "BTC,ETH"
      INITIAL_CAPITAL: "50"
      RISK_PER_TRADE: "0.02"
      STOP_LOSS_PCT: "0.03"        # fallback only — used if ATR fetch fails
      TAKE_PROFIT_PCT: "0.05"      # fallback only — used if ATR fetch fails
      MAX_ORDER_AMOUNT_USD: "25"
      MIN_BUYING_POWER_BUFFER: "25"
      CIRCUIT_BREAKER_LOSSES: "3"
      MIN_SIGNAL_GAP_PCT: "0.0015"
      MIN_SIGNAL_PROFIT_PCT: "0.03"
      MIN_HOLD_CANDLES: "4"
      # ── Strategy v2 ──
      ATR_PERIOD: "14"
      ATR_SL_MULTIPLIER: "2.0"     # SL = entry - 2×ATR
      ATR_TP_MULTIPLIER: "4.0"     # TP = entry + 4×ATR  (2:1 reward:risk)
      COOLDOWN_CANDLES: "4"        # 1hr block after exit before re-entering
      DRY_RUN: "0"
      PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crypto-bot-state-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crypto-bot-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-${{ github.run_id }}
          path: state.json
          retention-days: 7